<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wmhb</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FAFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="wmhb">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&display=swap">
<style>
:root{
  --ink:#1C1B15; --paper:#FAFAF7; --line:#E2DFD5; --mute:#5C5A50; --card:#FFFFFF;
  --yellow:#F1C22D; --tint:#F1EEE2; --green:#2E7D4F; --today:#EFECE3;
  --font:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.4 var(--font)}
body.lock{overflow:hidden}
button{font-family:var(--font);color:var(--ink);cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (max-width:999px){.lp{display:none!important}}
@media (min-width:1000px){.ph{display:none!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:4px;background:var(--ink);color:var(--paper);font:800 15px var(--font);white-space:nowrap}
.btn.ghost{padding:0 14px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
.btn.big{width:100%;min-height:52px;font-size:17px;white-space:normal}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{min-height:44px;padding:0 4px;border:0;background:transparent;font:800 15px var(--font);text-decoration:underline;text-underline-offset:3px}
.logo{line-height:1}
.logo div{font-weight:900;font-size:28px;letter-spacing:-.1em;line-height:.9}
.logo svg{display:block;margin:5px 0 0 6px}
.bang{display:inline-block;flex-shrink:0;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;text-align:center}
.dot{display:inline-block;flex-shrink:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.dot.booked{background:var(--green);border-color:var(--green)}
.dot.waiting{background:var(--yellow)}
.dot.enquiry{background:var(--card);border-style:dashed}
.dot.gone{background:var(--card);border:2px dashed #B4B0A3}

/* ---------- frame ---------- */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(20px + env(safe-area-inset-top)) 20px 0}
.top .l{display:flex;align-items:center;gap:10px}
.mbtn{width:44px;height:44px;margin-left:-10px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:transparent}
#view{padding:0 20px 28px}
h1{margin:16px 0 0;font-size:36px;font-weight:900;letter-spacing:-.05em;line-height:.95;text-transform:lowercase}
.titlerow{margin-bottom:12px}
.note{margin:0 0 12px;padding:10px 12px;border:1.5px dashed var(--ink);border-radius:6px;font-size:14px;font-weight:600;line-height:1.35}
.foot{display:flex;align-items:center;gap:4px 12px;flex-wrap:wrap;margin-top:20px;font-size:13px;font-weight:600;color:var(--mute)}

/* ---------- side menu ---------- */
.menu{position:fixed;left:0;top:0;bottom:0;z-index:41;width:86%;max-width:340px;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom));background:var(--paper);border-right:1.5px solid var(--ink);transform:translateX(-100%);visibility:hidden;transition:transform 260ms cubic-bezier(.2,.8,.2,1),visibility 260ms}
.menu.open{transform:none;visibility:visible}
.m-head{padding:calc(20px + env(safe-area-inset-top)) 12px 18px 20px;display:flex;justify-content:space-between;align-items:center}
.xbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);border-radius:4px;background:transparent}
.m-grp{padding:0 12px 0 0;display:flex;flex-direction:column;gap:2px}
.m-row{width:100%;min-height:52px;display:flex;align-items:center;gap:14px;padding:0 12px 0 16px;border:0;border-left:4px solid transparent;border-radius:0 4px 4px 0;background:transparent;font:600 17px var(--font);text-align:left}
.m-row[aria-current=page]{border-left-color:var(--ink);background:var(--tint);font-weight:800}
.m-row svg{flex-shrink:0;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.m-row .lab{flex:1;min-width:0}
.count{padding:2px 8px;border:1.5px solid var(--ink);border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.m-h{padding:22px 20px 6px;font-size:14px;font-weight:800;color:var(--mute)}
.m-end{margin-top:auto;padding-top:12px;border-top:1.5px solid var(--line)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(28,27,21,.45);opacity:0;pointer-events:none;transition:opacity 260ms ease}
.scrim.on{opacity:1;pointer-events:auto}

/* ---------- filter ---------- */
.fbar{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.fsum{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--mute);line-height:1.3}
.ontag{padding:1px 7px;border-radius:3px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:800}
.grab{width:40px;height:5px;border-radius:3px;background:#C9C5B8;margin:0 auto 10px}
.filter{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88%;overflow-y:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;background:var(--paper);transform:translateY(100%);visibility:hidden;transition:transform 260ms cubic-bezier(.2,.8,.2,1),visibility 260ms}
.filter.open{transform:none;visibility:visible}
.f-head{display:flex;justify-content:space-between;align-items:center}
.f-head h2{font-size:30px;font-weight:900;letter-spacing:-.04em}
.accs{margin-top:6px}
.acc{border-bottom:1.5px solid var(--line)}
.acch{width:100%;min-height:62px;display:flex;align-items:center;gap:12px;padding:8px 0;border:0;background:transparent;text-align:left}
.acch .t{flex:1;min-width:0}
.acch .t span:first-child{display:block;font-size:18px;font-weight:800}
.acch .t span:last-child{display:block;font-size:14px;font-weight:600;color:var(--mute)}
.acch .mini{display:flex;gap:4px}
.acch .pm{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--ink);font-size:18px;font-weight:800;line-height:25px;text-align:center}
.accb{padding:0 0 10px}
.tick{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:6px 0;border:0;border-bottom:1.5px solid var(--line);background:transparent;text-align:left}
.tick .box{width:24px;height:24px;flex-shrink:0;border-radius:4px;border:2px solid var(--ink);background:var(--card);display:inline-flex;align-items:center;justify-content:center}
.tick .box svg{fill:none;stroke:var(--paper);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick[aria-pressed=true] .box{background:var(--ink)}
.tick[aria-pressed=true] .box svg{opacity:1}
.tick .dot{width:16px;height:16px}
.tick .tl{flex:1;min-width:0}
.tick .tl span:first-child{display:block;font-size:16px;font-weight:700;line-height:1.2}
.tick .tl span+span{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.tick .n{font-size:14px;font-weight:700;color:var(--mute)}
.filter>.btn.big{margin-top:18px}
.fh{padding:16px 0 0;font-size:14px;font-weight:800;color:var(--mute)}
.fnote{margin:14px 0 0;font-size:14px;font-weight:600;color:var(--mute)}

/* ---------- calendar ---------- */
.clash{margin:0 0 12px;padding:10px 12px;border-radius:6px;background:var(--card);border:1.5px solid var(--ink);display:flex;align-items:center;gap:10px}
.clash .bang{width:24px;height:24px;font-size:14px;line-height:24px}
.clash .t{flex:1;min-width:0;font-size:14px;line-height:1.35}
.clash .t b{font-weight:800}
.clash .btn{padding:0 12px;font-size:14px;flex-shrink:0}
.mbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.mbar button{width:44px;height:44px;border:1.5px solid var(--ink);border-radius:4px;background:transparent;font:800 18px var(--font)}
.mbar div{font-size:22px;font-weight:900;letter-spacing:-.03em}
.calwrap{margin:0 -6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow{font-size:12px;font-weight:700;color:var(--mute);text-align:center;padding-bottom:4px}
.pc{position:relative;height:60px;border-radius:4px;background:var(--card)}
.pc.out{background:var(--paper)}
.pc.today{background:var(--today)}
.pcb{display:block;width:100%;height:60px;padding:0;border:0;border-radius:4px;background:transparent}
.num{display:block;width:34px;height:34px;margin:2px auto 0;border-radius:50%;border:2px solid transparent;font-size:16px;font-weight:600;line-height:30px;text-align:center}
.out .num{color:#8A8576}
.num.booked{background:var(--green);border-color:var(--green);color:#fff;font-weight:800}
.num.waiting{background:var(--yellow);border-color:var(--ink);font-weight:800}
.num.enquiry{background:var(--card);border:2px dashed var(--ink);font-weight:800}
.nm{display:block;padding:0 1px;font-size:11px;font-weight:700;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center}
.pc .bang{position:absolute;top:0;right:2px;width:18px;height:18px;font-size:12px;line-height:18px}
.key{padding:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:600;color:var(--mute)}
.key span{display:inline-flex;align-items:center;gap:5px}
.key .bang{width:14px;height:14px;font-size:10px;line-height:14px}

/* ---------- list ---------- */
.sec{padding:18px 0 2px;font-size:15px;font-weight:800;color:var(--mute)}
.row{display:flex;align-items:flex-start;gap:12px;width:100%;padding:10px 0;border:0;border-bottom:1.5px solid var(--line);background:transparent;text-align:left;font-family:var(--font)}
.when{display:block;width:58px;flex-shrink:0;line-height:1.15}
.when span:first-child{display:block;font-size:12px;font-weight:700;color:var(--mute)}
.when span:last-child{display:block;font-size:15px;font-weight:800}
.who{display:block;flex:1;min-width:0}
.who .n{display:block;font-size:16px;font-weight:800;line-height:1.2}
.who .s{display:block;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.who .bs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{padding:2px 9px;border-radius:999px;border:2px solid var(--ink);font-size:12px;font-weight:700;white-space:nowrap}
.badge.booked{background:var(--green);border-color:var(--green);color:#fff}
.badge.waiting{background:var(--yellow)}
.badge.enquiry{background:var(--card);border-style:dashed}
.badge.clashb{background:var(--ink);color:#fff;font-weight:800}
.chg{align-self:center;font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:3px}
.empty{padding:14px 0;font-size:14px;color:var(--mute)}

/* ---------- coming next ---------- */
.next{max-width:560px;margin-top:16px;padding:16px 18px;border:1.5px dashed var(--ink);border-radius:6px;font-size:15px}
.next p{font-weight:800;margin-bottom:8px}
.next ul{margin:0;padding-left:20px}
.next li{margin:4px 0}

/* ---------- sheets ---------- */
dialog{width:100%;max-width:100%;max-height:90%;margin:auto 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));border:0;border-radius:16px 16px 0 0;background:var(--paper);color:var(--ink);overflow-y:auto}
dialog::backdrop{background:rgba(28,27,21,.5)}
dialog[open]{animation:up 260ms cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.pk-k{font-size:13px;font-weight:800;color:var(--mute)}
dialog h2{margin:2px 0 4px;font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1.05}
.pk-e{font-size:15px}
.pk-c{margin-top:2px;font-size:14px;color:var(--mute);overflow-wrap:anywhere}
.warn{margin:12px 0 0;padding:10px 12px;border-radius:6px;background:var(--tint);border:1.5px solid var(--ink);font-size:14px;font-weight:700;line-height:1.35}
.pk-q{padding:16px 0 8px;font-size:14px;font-weight:800;color:var(--mute)}
.opt{width:100%;min-height:62px;display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:8px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);text-align:left}
.opt[aria-pressed=true]{border:2px solid var(--ink)}
.opt .dot{width:22px;height:22px}
.opt .tl{flex:1;min-width:0}
.opt .tl span:first-child{display:block;font-size:16px;font-weight:800}
.opt .tl span+span{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.opt .chk{width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.opt .chk svg{fill:none;stroke:var(--paper);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.opt:disabled{opacity:.55}
dialog .btn.big{margin-top:8px}
.err{margin-top:8px;font-size:14px;font-weight:800}
.err:empty{display:none}
.datestep label,.fld label{display:block;margin-bottom:4px;font-size:14px;font-weight:800}
.datestep input,.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;min-height:44px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;font:600 16px var(--font);color:var(--ink)}
.datestep{padding-top:16px}
.datestep .btn{margin-top:10px}
.fields{display:grid;grid-template-columns:minmax(0,1fr);gap:12px 16px;margin-top:14px}
.fld{min-width:0}
.fld textarea{min-height:96px;font-size:15px;font-weight:500}
.fld small{display:block;margin-top:4px;color:var(--mute);font-size:13px}
.fld.tickf{display:flex;align-items:center;gap:10px;min-height:44px}
.fld.tickf input{width:24px;height:24px;margin:0;accent-color:var(--ink)}
.fld.tickf label{margin:0;font-size:15px;font-weight:700}
#save{margin-top:16px}
.center{display:block;margin:4px auto 0}
.toast{position:fixed;left:50%;bottom:20px;z-index:60;max-width:calc(100% - 32px);padding:12px 18px;border-radius:4px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:700;opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- laptop ---------- */
@media (min-width:1000px){
  .menu{position:sticky;top:0;height:100vh;width:248px;max-width:none;flex-shrink:0;padding:28px 0 20px;border-right:1.5px solid var(--line);transform:none;visibility:visible;transition:none}
  .m-head{padding:0 24px 24px}
  .m-row{min-height:46px;font-size:16px}
  .count{font-size:12px}
  .scrim{display:none}
  #view{padding:32px 40px}
  .titlerow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  h1{margin:0;font-size:44px}
  .note{margin:0 0 20px}
  .cols{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
  .filter{position:static;z-index:auto;flex:1 1 250px;min-width:0;max-height:none;overflow:visible;padding:14px 18px 18px;border:1.5px solid var(--line);border-radius:4px;background:var(--card);transform:none;visibility:visible;transition:none}
  .filter .grab{display:none}
  .cal{flex:999 1 520px;min-width:0}
  .list{flex:1 1 280px;min-width:0}
  .list .sec:first-child{padding:0 0 4px}
  .mbar{margin-bottom:12px}
  .calwrap{margin:0}
  .grid{gap:6px}
  .dow{text-align:left}
  .lc{position:relative;min-height:88px;padding:7px;border:1.5px solid var(--line);border-radius:4px;background:var(--card)}
  .lc.out{background:var(--paper)}
  .lc.today{background:var(--today)}
  .lc.has{border-color:var(--ink)}
  .lc .dn{font-size:15px;font-weight:600}
  .lc.has .dn{font-weight:800}
  .pill{display:block;width:100%;margin-top:5px;padding:3px 7px;border-radius:3px;border:2px solid var(--ink);font:700 13px var(--font);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill.booked{background:var(--green);border-color:var(--green);color:#fff}
  .pill.waiting{background:var(--yellow)}
  .pill.enquiry{background:var(--card);border-style:dashed}
  .ctag{position:absolute;top:6px;right:6px;padding:1px 7px;border-radius:999px;background:var(--ink);color:#fff;font-size:11px;font-weight:800}
  dialog{width:min(480px,calc(100% - 32px));max-height:calc(100% - 48px);margin:auto;padding:24px;border-radius:10px}
  dialog.wide{width:min(640px,calc(100% - 32px))}
  dialog .grab{display:none}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fld.wide{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){
  .menu,.filter,.scrim,.toast{transition:none}
  dialog[open]{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <nav class="menu" id="menu" aria-label="Menu">
    <div class="m-head">
      <div class="logo" role="img" aria-label="wmhb"><div>wmhb</div><svg aria-hidden="true" width="52" height="8" viewBox="0 0 500 57" fill="#1C1B15"><path class="ruler"></path></svg></div>
      <button class="xbtn ph" type="button" data-menu-close aria-label="Close menu"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1B15" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="menuList"></div>
    <div class="m-end" id="menuEnd"></div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top ph">
      <div class="l">
        <button class="mbtn" type="button" id="menuBtn" data-menu-open aria-label="Open menu" aria-expanded="false" aria-controls="menu"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1C1B15" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="logo" role="img" aria-label="wmhb"><div>wmhb</div><svg aria-hidden="true" width="52" height="8" viewBox="0 0 500 57" fill="#1C1B15"><path class="ruler"></path></svg></div>
      </div>
      <button class="btn" type="button" data-new>Add a booking</button>
    </header>

    <main id="view">
      <section id="v-clients" aria-labelledby="h-clients">
        <div class="titlerow"><h1 id="h-clients">clients</h1><button class="btn lp" type="button" data-new>Add a booking</button></div>
        <p class="note" id="note" role="status" hidden></p>
        <div class="fbar ph"><button class="btn ghost" type="button" id="fopen" data-fopen aria-expanded="false" aria-controls="filter"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1B15" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters<span class="ontag" id="fon" hidden>On</span></button><p class="fsum" id="fsum"></p></div>
        <div class="cols">
          <div class="filter" id="filter" aria-label="Filter the calendar"></div>
          <div class="cal">
            <div id="clashes"></div>
            <div class="mbar">
              <button type="button" data-month="-1" aria-label="Previous month">&lt;</button>
              <div id="mlabel" aria-live="polite"></div>
              <button type="button" data-month="1" aria-label="Next month">&gt;</button>
            </div>
            <div class="calwrap"><div class="grid" id="grid"></div></div>
            <div class="key">
              <span><i class="dot booked" aria-hidden="true"></i>Booked</span><span><i class="dot waiting" aria-hidden="true"></i>Waiting on deposit</span><span><i class="dot enquiry" aria-hidden="true"></i>Enquiry</span><span><i class="bang" aria-hidden="true">!</i>Clash</span>
            </div>
          </div>
          <div class="list" id="list"></div>
        </div>
      </section>

      <section id="v-next" hidden></section>

      <div class="foot"><span id="fresh" role="status"></span><button class="linkbtn" type="button" id="refresh" data-refresh style="font-size:13px">Refresh</button></div>
    </main>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* The /exec address of the new back end ("wmhb app 2") goes here once it is deployed.
   While it is empty the page shows made-up sample data and saves nothing. */
const API = "";
const DEMO = !API || /[?&]demo\b/.test(location.search);
/* The key comes from the page address (#k=...) and is kept on this device only. It is never written in this file. */
let KEY = (/[#&]k=([^&]+)/.exec(location.hash) || [])[1] || "";
try { if (KEY) localStorage.setItem("wmhb2.k", KEY); else KEY = localStorage.getItem("wmhb2.k") || ""; } catch (e) {}

const DAY = 864e5;
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-NZ");
const txt = v => v == null ? "" : String(v).trim();
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const ms = iso => Date.parse(iso + "T00:00:00Z");
const addDays = (iso, n) => new Date(ms(iso) + n * DAY).toISOString().slice(0, 10);
const dParts = iso => { const d = new Date(ms(iso)); return { wd: WD[d.getUTCDay()], d: d.getUTCDate(), mo: MO[d.getUTCMonth()], m: d.getUTCMonth(), y: d.getUTCFullYear() }; };
const fmt = iso => { const p = dParts(iso); return p.wd + " " + p.d + " " + p.mo; };
const isoOf = (y, m, d) => y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
function todayIso() {
  const p = {}; new Intl.DateTimeFormat("en-GB", { timeZone: "Pacific/Auckland", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date()).forEach(x => p[x.type] = x.value);
  return p.year + "-" + p.month + "-" + p.day;
}
const clock = t => new Intl.DateTimeFormat("en-NZ", { timeZone: "Pacific/Auckland", hour: "numeric", minute: "2-digit" }).format(new Date(t)).replace(/\s/g, " ").toLowerCase();
const listAnd = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
const phone = () => !matchMedia("(min-width:1000px)").matches;

/* Enquiry dates are typed by clients: "5 December 2026", "January 2027", or nothing. */
function parseLoose(t) {
  t = txt(t).replace(/^[A-Za-z]{3,9},?\s+(?=\d)/, "");
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t), y, mo, d;
  if (m) { y = +m[1]; mo = +m[2] - 1; d = +m[3]; }
  else if ((m = /^(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3})[A-Za-z]*\.?,?\s+(\d{4})$/.exec(t))) { d = +m[1]; mo = MO.findIndex(x => x.toLowerCase() === m[2].toLowerCase()); y = +m[3]; }
  else if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(t))) { d = +m[1]; mo = +m[2] - 1; y = +m[3]; }
  else return null;
  if (mo < 0 || mo > 11 || d < 1) return null;
  const iso = isoOf(y, mo, d), back = new Date(ms(iso));
  return back.getUTCDate() === d && back.getUTCMonth() === mo ? iso : null;
}
function groupOf(type) {
  const t = txt(type).toLowerCase();
  if (/wedding/.test(t)) return "Weddings";
  if (/corporate|brand/.test(t)) return "Corporate";
  if (/market|expo|fair|\bshow\b/.test(t)) return "Markets";
  return "Celebrations";
}

/* ---------- menu ---------- */
const ICON = {
  clients: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  money: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v5M18 9.5v5"/>',
  eventday: '<rect x="5" y="4.5" width="14" height="16.5" rx="2"/><path d="M9 3h6v3H9zM8.5 12.8l2.2 2.2 4.8-4.8"/>',
  videos: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.2v5.6l4.8-2.8z"/>',
  designs: '<path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5zM13.5 7l3 3"/>',
  prices: '<path d="M3.5 12.2V4.5h7.7l9.3 9.3-7.7 7.7z"/><circle cx="8" cy="9" r="1.4"/>',
  partners: '<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M15.5 14.2a4.6 4.6 0 0 1 5 5.3"/>',
  settings: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'
};
const TABS = [
  { id: "clients", label: "Clients" },
  { id: "money", label: "Money", next: ["Who owes what (deposits and balances)", "Invoices, numbered INV-0000", "Costs for each booking, and profit each month"] },
  { id: "eventday", label: "Event day", next: ["The next event’s address, time and setup", "The packing list for the board", "A power point within 10 m, or bring the power station"] },
  { id: "videos", label: "Videos", next: ["Events with guest videos still to send", "Mark them sent once the client has them"] },
  { id: "designs", label: "Designs", next: ["Each client’s board and screen designs", "What’s approved and what’s still with Sara"] },
  { id: "prices", label: "Prices and packages", group: "Business", next: ["The packages and extras", "Deposit and balance rules"] },
  { id: "partners", label: "Partners", group: "Business", next: ["Decor businesses that send clients", "Who referred who, and the 10% fee owed"] },
  { id: "settings", label: "Settings", end: true, next: ["Aadil’s and Sara’s logins", "Email signature and templates"] }
];
function drawMenu() {
  const row = t => {
    const n = t.id === "clients" ? S.toAnswer : t.id === "money" ? S.toChase : 0;
    return "<button type=\"button\" class=\"m-row\" data-tab=\"" + t.id + "\" data-fid=\"m-" + t.id + "\"" + (S.tab === t.id ? " aria-current=\"page\"" : "") + "><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\">" + ICON[t.id] + "</svg><span class=\"lab\">" + t.label + "</span>" +
      (n ? "<span class=\"count\">" + n + (t.id === "clients" ? " to answer" : " to chase") + "</span>" : "") + "</button>";
  };
  $("#menuList").innerHTML = "<div class=\"m-grp\">" + TABS.filter(t => !t.group && !t.end).map(row).join("") + "</div><h2 class=\"m-h\">Business</h2><div class=\"m-grp\">" + TABS.filter(t => t.group).map(row).join("") + "</div>";
  $("#menuEnd").innerHTML = "<div class=\"m-grp\">" + TABS.filter(t => t.end).map(row).join("") + "</div>";
}
function menu(open) {
  $("#menu").classList.toggle("open", open); $("#scrim").classList.toggle("on", open);
  $("#menuBtn").setAttribute("aria-expanded", open); document.body.classList.toggle("lock", open);
  if (open) $("[data-menu-close]").focus(); else if (phone()) $("#menuBtn").focus();
}
function sheet(open) {
  $("#filter").classList.toggle("open", open); $("#scrim").classList.toggle("on", open);
  $("#fopen").setAttribute("aria-expanded", open); document.body.classList.toggle("lock", open);
  if (open) $("#filter [data-freset]").focus(); else if (phone()) $("#fopen").focus();
}
function go(tab) {
  S.tab = tab; const t = TABS.find(x => x.id === tab);
  $("#v-clients").hidden = tab !== "clients"; $("#v-next").hidden = tab === "clients";
  if (t.next) $("#v-next").innerHTML = "<div class=\"titlerow\"><h1>" + esc(t.label) + "</h1></div><div class=\"next\"><p>We design this screen next. It will have:</p><ul>" + t.next.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  drawMenu(); scrollTo(0, 0);
}

/* ---------- the data ---------- */
const STATUS_KEYS = [["booked", "Booked", "Deposit in. Paid, or balance to pay"], ["waiting", "Waiting on deposit", "Invoice sent, deposit not in yet"], ["enquiry", "Enquiry", "New, or waiting on their reply"]];
const TYPE_KEYS = ["Celebrations", "Weddings", "Corporate", "Markets"];
const S = { tab: "clients", ym: null, f: {}, acc: "status", items: [], clash: new Map(), toAnswer: 0, toChase: 0, data: null, readAt: 0 };
STATUS_KEYS.forEach(k => S.f[k[0]] = true); TYPE_KEYS.forEach(k => S.f[k] = true);

function build(data) {
  const items = [], today = todayIso(); let toChase = 0, toAnswer = 0;
  for (const b of data.bookings || []) {
    const name = txt(b.client), st = txt(b.status); if (!name) continue;
    if (st === "Cancelled" || txt(b.cancelled) === "Yes") continue;
    const owing = Math.max(0, num(b.owing)), received = num(b.received);
    /* Booked = deposit in. Waiting on deposit = invoice sent, deposit not in. Both come from the tracker's Status column.
       A completed booking keeps the Booked look. */
    const kind = st === "Booked" || st === "Completed" ? "booked" : st === "Waiting on deposit" ? "waiting" : received > 0 ? "booked" : "waiting";
    if (kind === "waiting" || owing > 0) toChase++;
    const date = /^\d{4}-\d{2}-\d{2}$/.test(txt(b.date)) ? b.date : null;
    items.push({ id: "b" + b.row, booking: true, kind, live: !date || date >= today, name, short: name.split(/\s+/)[0], date, dateText: "",
      type: txt(b.type), group: groupOf(b.type), venue: [txt(b.venue), txt(b.suburb)].filter(Boolean).join(", "), contact: "", owing, ref: b });
  }
  for (const q of data.enquiries || []) {
    const name = txt(q.name), st = txt(q.status) || "New"; if (!name || txt(q.what)) continue;        /* anything in "What happened" is closed */
    if (st !== "New" && st !== "Waiting on response") continue;
    if (st === "New") toAnswer++;
    const venue = (/venue:\s*([^\n]+)/i.exec(txt(q.message)) || [])[1] || "";
    items.push({ id: "q" + q.row, booking: false, kind: "enquiry", live: true, status: st, name, short: name.split(/\s+/)[0], date: parseLoose(q.date), dateText: txt(q.date),
      type: txt(q.type), group: groupOf(q.type), venue: venue.trim(), contact: txt(q.contact), owing: 0, ref: q });
  }
  const rank = { booked: 0, waiting: 1, enquiry: 2 };
  items.sort((a, b) => (a.date || "9") < (b.date || "9") ? -1 : (a.date || "9") > (b.date || "9") ? 1 : rank[a.kind] - rank[b.kind]);
  /* Clash rule: more than one live item on a date. There is only one board. */
  const by = new Map();
  items.forEach(i => { if (i.date && i.live) by.set(i.date, (by.get(i.date) || []).concat(i)); });
  S.clash = new Map([...by].filter(e => e[1].length > 1));
  S.items = items; S.toAnswer = toAnswer; S.toChase = toChase;
}
const match = i => S.f[i.kind] && S.f[i.group];
const ymKey = () => isoOf(S.ym[0], S.ym[1], 1).slice(0, 7);
const inMonth = i => i.date && i.date.slice(0, 7) === ymKey();
const clashes = i => i.date && S.clash.has(i.date) && S.clash.get(i.date).includes(i);
function badges(i) {
  const t = i.kind === "booked" ? (i.owing > 0 ? "Booked (" + money(i.owing) + " to pay)" : "Booked (paid)") : i.kind === "waiting" ? "Waiting on deposit" : i.status === "New" ? "Enquiry: new" : "Enquiry: waiting on response";
  return "<span class=\"badge " + i.kind + "\">" + esc(t) + "</span>" + (clashes(i) ? "<span class=\"badge clashb\">Clash</span>" : "");
}
const said = i => i.name + (i.kind === "booked" ? " is booked" : i.kind === "waiting" ? " is waiting on deposit" : " has enquired");
const word = i => i.kind === "booked" ? "booked" : i.kind === "waiting" ? "waiting on deposit" : "enquiry";

/* ---------- drawing the clients screen ---------- */
function keepFocus(fn) {
  const a = document.activeElement, id = a && a.dataset && a.dataset.fid; fn();
  if (id) { const el = document.querySelector("[data-fid=\"" + id + "\"]"); if (el) el.focus(); }
}
const CHECK = "<svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\"><path d=\"M5 12l5 5L20 7\"/></svg>";
function drawFilter() {
  const P = phone(), n = S.items.filter(match).length;
  const offS = STATUS_KEYS.filter(k => !S.f[k[0]]), offT = TYPE_KEYS.filter(k => !S.f[k]);
  const tick = (k, label, desc, dot) => "<button class=\"tick\" type=\"button\" data-tick=\"" + k + "\" data-fid=\"t-" + k + "\" aria-pressed=\"" + S.f[k] + "\"><span class=\"box\">" + CHECK + "</span>" + (dot ? "<i class=\"dot " + k + "\" aria-hidden=\"true\"></i>" : "") +
    "<span class=\"tl\"><span>" + label + "</span>" + (desc ? "<span>" + desc + "</span>" : "") + "</span><span class=\"n\">" + S.items.filter(i => i.kind === k || i.group === k).length + "</span></button>";
  const ticksS = STATUS_KEYS.map(k => tick(k[0], k[1], k[2], true)).join(""), ticksT = TYPE_KEYS.map(k => tick(k, k, "", false)).join("");
  const on = offS.length + offT.length > 0, parts = [];
  if (offS.length) parts.push("Bookings: " + (STATUS_KEYS.filter(k => S.f[k[0]]).map(k => k[1]).join(", ") || "none"));
  if (offT.length) parts.push("Event type: " + (TYPE_KEYS.filter(k => S.f[k]).join(", ") || "none"));
  const sum = on ? parts.join("; ") : "Showing everything";
  const head = "<div class=\"f-head\"><h2>filter</h2><button class=\"linkbtn\" type=\"button\" data-freset data-fid=\"reset\">Reset</button></div>";
  const group = (id, title, off, mini, rows) => "<div class=\"acc\"><button class=\"acch\" type=\"button\" data-acc=\"" + id + "\" data-fid=\"acc-" + id + "\" aria-expanded=\"" + (S.acc === id) + "\"><span class=\"t\"><span>" + title + "</span><span>" + (off.length ? "Hiding " + esc(off.join(", ")) : "All showing") + "</span></span><span class=\"mini\">" + mini + "</span><span class=\"pm\" aria-hidden=\"true\">" + (S.acc === id ? "−" : "+") + "</span></button>" +
    (S.acc === id ? "<div class=\"accb\">" + rows + "</div>" : "") + "</div>";
  $("#filter").innerHTML = P
    ? "<div class=\"grab\" aria-hidden=\"true\"></div>" + head + "<div class=\"accs\">" + group("status", "Bookings", offS.map(k => k[1]), STATUS_KEYS.map(k => "<i class=\"dot " + k[0] + "\" aria-hidden=\"true\"></i>").join(""), ticksS) + group("type", "Event type", offT, "", ticksT) + "</div>" +
      "<button class=\"btn big\" type=\"button\" data-fclose data-fid=\"show\">Show " + n + " booking" + (n === 1 ? "" : "s") + " and enquiries</button>"
    : head + "<h3 class=\"fh\">Bookings</h3>" + ticksS + "<h3 class=\"fh\">Event type</h3>" + ticksT + "<p class=\"fnote\">" + esc(sum) + "</p>";
  $("#fon").hidden = !on; $("#fsum").textContent = sum;
}
function drawCal() {
  const P = phone(), [y, m] = S.ym, today = todayIso(), first = new Date(Date.UTC(y, m, 1)), lead = (first.getUTCDay() + 6) % 7;
  const days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(), cells = Math.ceil((lead + days) / 7) * 7, start = addDays(isoOf(y, m, 1), -lead);
  $("#mlabel").textContent = MONTHS[m] + " " + y;
  let h = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => "<div class=\"dow\" aria-hidden=\"true\">" + d + "</div>").join("");
  for (let c = 0; c < cells; c++) {
    const iso = addDays(start, c), p = dParts(iso), out = p.m !== m;
    const its = out ? [] : S.items.filter(i => i.date === iso && match(i)), clash = !out && S.clash.has(iso), q = its.find(i => !i.booking);
    const cls = (out ? " out" : "") + (iso === today ? " today" : "");
    if (P) {
      const inner = "<span class=\"num " + (its.length ? its[0].kind : "") + "\">" + p.d + "</span><span class=\"nm\">" + (its.length ? esc(its[0].short) + (its.length > 1 ? " +" + (its.length - 1) : "") : "") + "</span>";
      const bang = clash ? "<span class=\"bang\" role=\"img\" aria-label=\"Clash\">!</span>" : "";
      h += "<div class=\"pc" + cls + "\">" + (q ? "<button type=\"button\" class=\"pcb\" data-item=\"" + q.id + "\" data-fid=\"c-" + iso + "\" aria-label=\"Change the status of " + esc(q.name) + ", " + fmt(iso) + (its.length > 1 ? ". Also that day: " + esc(its.filter(i => i !== q).map(i => i.name + ", " + word(i)).join("; ")) : "") + "\">" + inner + "</button>"
        : inner + (its.length ? "<span class=\"sr\">" + esc(its.map(word).join(", ")) + "</span>" : "")) + bang + "</div>";
    } else {
      h += "<div class=\"lc" + cls + (its.length ? " has" : "") + "\"><div class=\"dn\">" + p.d + "</div>" + its.map(i => i.booking
        ? "<div class=\"pill " + i.kind + "\">" + esc(i.short) + "<span class=\"sr\">, " + word(i) + "</span></div>"
        : "<button type=\"button\" class=\"pill enquiry\" data-item=\"" + i.id + "\" data-fid=\"c-" + i.id + "\" aria-label=\"Change the status of " + esc(i.name) + ", " + fmt(iso) + "\">" + esc(i.short) + "</button>").join("") + (clash ? "<span class=\"ctag\">Clash</span>" : "") + "</div>";
    }
  }
  $("#grid").innerHTML = h;
  $("#clashes").innerHTML = [...S.clash].filter(e => e[0].slice(0, 7) === ymKey()).sort().map(([iso, its]) => {
    const q = its.find(i => !i.booking);
    return "<div class=\"clash\"><span class=\"bang\" aria-hidden=\"true\">!</span><span class=\"t\"><b>Clash on " + fmt(iso) + ".</b> " + esc(listAnd(its.map(said))) + ", on the same day.</span>" + (q ? "<button class=\"btn ghost\" type=\"button\" data-item=\"" + q.id + "\" data-fid=\"x-" + iso + "\">Open</button>" : "") + "</div>";
  }).join("");
}
function rowHtml(i) {
  const p = i.date ? dParts(i.date) : null, mon = /^([A-Za-z]{3})[a-z]*\s+(\d{4})$/.exec(i.dateText);
  const when = p ? "<span>" + p.wd + "</span><span>" + p.d + " " + p.mo + "</span>" : "<span>No date</span><span>" + esc(mon ? mon[1] + " " + mon[2] : i.dateText || "yet") + "</span>";
  const body = "<span class=\"when\">" + when + "</span><span class=\"who\"><span class=\"n\">" + esc(i.name) + "</span><span class=\"s\">" + esc([i.type, i.venue].filter(Boolean).join(", ")) + "</span><span class=\"bs\">" + badges(i) + "</span></span>";
  return i.booking ? "<div class=\"row\">" + body + "</div>" : "<button type=\"button\" class=\"row\" data-item=\"" + i.id + "\" data-fid=\"r-" + i.id + "\">" + body + "<span class=\"chg\">Change</span></button>";
}
function drawList() {
  const shown = S.items.filter(match), mName = MONTHS[S.ym[1]];
  if (!phone()) { $("#list").innerHTML = "<h3 class=\"sec\">Everything that matches</h3>" + (shown.map(rowHtml).join("") || "<p class=\"empty\">Nothing matches these filters.</p>"); return; }
  const month = shown.filter(inMonth), enq = shown.filter(i => !i.date && !i.booking), bk = shown.filter(i => !i.date && i.booking);
  $("#list").innerHTML = "<h3 class=\"sec\">In " + mName + "</h3>" + (month.map(rowHtml).join("") || "<p class=\"empty\">Nothing in " + mName + (S.items.some(inMonth) ? " with these filters." : ".") + "</p>") +
    (enq.length ? "<h3 class=\"sec\">Enquiries with no date yet</h3>" + enq.map(rowHtml).join("") : "") + (bk.length ? "<h3 class=\"sec\">Bookings with no date yet</h3>" + bk.map(rowHtml).join("") : "");
}
function draw() { keepFocus(() => { drawMenu(); drawFilter(); drawCal(); drawList(); }); }

/* ---------- talking to the tracker ---------- */
const dlg = $("#dlg");
let busy = false, form = null;
async function server(fn, arg) {
  if (DEMO) return demoServer(fn, arg);
  const res = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ k: KEY, fn, arg }), credentials: "omit", redirect: "follow" });
  if (!res.ok) throw new Error("the tracker answered with error " + res.status);
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return typeof j.result === "string" ? JSON.parse(j.result) : j.result;
}
const why = x => ((x && x.message) || "The tracker didn’t answer.").replace(/^Error:\s*/, "");
function apply(data) {
  S.data = data; S.readAt = data.readAt || Date.now(); build(data); draw();
  $("#fresh").textContent = DEMO ? "Sample data, made up for testing the screens. Nothing is saved." : "Read from the tracker at " + clock(S.readAt) + ".";
}
async function load() {
  if (!DEMO && !KEY) { note("This device doesn’t have the key yet. Open the full private link you were sent, then add that page to your home screen."); return; }
  if (busy) return; busy = true; $("#refresh").disabled = true;
  try { apply((await server("getData")).data); note(DEMO ? "Sample data. The names are made up and nothing you tap is saved." : ""); }
  catch (x) { note("Couldn’t read the tracker (" + why(x) + "). Press Refresh to try again."); }
  finally { busy = false; $("#refresh").disabled = false; }
}
function note(msg) { const el = $("#note"); el.textContent = msg; el.hidden = !msg; }
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 5000); }

/* ---------- enquiry status picker ---------- */
const OPTS = [
  ["New", "enquiry", "Nobody has replied yet"],
  ["Waiting on response", "enquiry", "We replied, waiting to hear back"],
  ["Waiting on deposit", "waiting", "They want to book. It moves to bookings and turns yellow."],
  ["Cancelled", "gone", "Hides it from the calendar. It stays in the tracker."]
];
const GRAB = "<div class=\"grab\" aria-hidden=\"true\"></div>";
function show(html, wide) { form = null; dlg.className = wide ? "wide" : ""; dlg.innerHTML = GRAB + html; if (!dlg.open) dlg.showModal(); }
function headHtml(i) {
  const when = i.date ? fmt(i.date) + (dParts(i.date).y !== +todayIso().slice(0, 4) ? " " + dParts(i.date).y : "") : i.dateText || "no date yet";
  return "<div class=\"pk-k\">Enquiry</div><h2 id=\"dlg-title\">" + esc(i.name) + "</h2><p class=\"pk-e\">" + esc([i.type, i.venue, when].filter(Boolean).join(", ")) + "</p>" + (i.contact ? "<p class=\"pk-c\">" + esc(i.contact) + "</p>" : "");
}
function openPicker(i) {
  const others = i.date && S.clash.has(i.date) ? S.clash.get(i.date).filter(o => o.id !== i.id) : [];
  show(headHtml(i) + (others.length ? "<div class=\"warn\">Clash: " + esc(listAnd(others.map(said))) + " on " + fmt(i.date) + ". With one board we can’t take " + (others.length > 1 ? "them all" : "both") + ".</div>" : "") +
    "<h3 class=\"pk-q\">Where is this enquiry up to?</h3>" + OPTS.map(o =>
    "<button class=\"opt\" type=\"button\" data-opt=\"" + o[0] + "\" data-id=\"" + i.id + "\" aria-pressed=\"" + (i.status === o[0]) + "\"><i class=\"dot " + o[1] + "\" aria-hidden=\"true\"></i><span class=\"tl\"><span>" + o[0] + "</span><span>" + o[2] + "</span></span>" + (i.status === o[0] ? "<span class=\"chk\" aria-hidden=\"true\">" + CHECK + "</span>" : "") + "</button>").join("") +
    "<p class=\"err\" id=\"err\" role=\"alert\"></p><button class=\"btn big\" type=\"button\" data-close>Done</button>");
}
function askDate(i) {
  show(headHtml(i) + "<div class=\"datestep\"><label for=\"edate\">When is the event?</label><input id=\"edate\" type=\"date\" min=\"" + todayIso() + "\">" +
    "<button class=\"btn big\" type=\"button\" id=\"mk\" data-mk=\"" + i.id + "\" disabled>Create the booking</button><button class=\"btn big ghost\" type=\"button\" data-mk=\"" + i.id + "\" data-skip>Don’t know yet</button></div>" +
    "<p class=\"err\" id=\"err\" role=\"alert\"></p><button class=\"linkbtn center\" type=\"button\" data-item=\"" + i.id + "\">Back</button>");
  $("#edate").addEventListener("input", e => { $("#mk").disabled = !e.target.value; });
}
async function setStatus(i, status, eventDate) {
  if (!i || status === i.status) return;
  if (status === "Waiting on deposit" && !i.date && eventDate === undefined) { askDate(i); return; }
  dlg.querySelectorAll("button").forEach(b => b.disabled = true);
  try {
    const res = await server("setEnquiryStatus", { row: i.ref.row, name: i.name, status, eventDate: eventDate || "" });
    apply(res.data);
    const still = S.items.find(x => x.id === i.id);
    if (still) openPicker(still); else dlg.close();      /* New and Waiting on response stay open, so a mis-tap is easy to put right */
    toast(status === "Waiting on deposit" ? i.name + " is now booking " + (res.id || "") + ", waiting on deposit." : status === "Cancelled" ? i.name + "’s enquiry is cancelled." : i.name + ": " + status.toLowerCase() + ".");
  } catch (x) { dlg.querySelectorAll("button").forEach(b => b.disabled = b.id === "mk" && !$("#edate").value); $("#err").textContent = "Not saved. " + why(x); }
}

/* ---------- add a booking ---------- */
function newFields() {
  const L = S.data.lists || {}, f = (key, kind, label, o) => Object.assign({ key, kind, label }, o || {});
  return [
    f("Client name", "text", "Client name", { wide: true, hint: "A repeat client? Type the name exactly as before." }),
    f("Event date", "date", "Event date"), f("Event type", "pick", "Event type", { options: L["Event type"] || [], blank: "Choose" }),
    f("Package", "pick", "Package", { options: (S.data.packages || []).map(p => p.name), blank: "Choose" }),
    f("Custom price", "num", "Custom price", { hint: "Only for the Custom package." }),
    f("Venue", "text", "Venue"), f("Suburb", "text", "Suburb"),
    f("Region", "pick", "Region", { options: L["Region"] || [], blank: "Choose" }),
    f("How they found us", "pick", "How they found us", { options: L["How they found us"] || [], blank: "Not sure" }),
    f("Custom board and screen", "yes", "Custom board and screen"), f("Highlight reel", "yes", "Highlight reel"),
    f("No power point", "yes", "No power point, so battery power"), f("Second event", "yes", "Second event"),
    f("Extra hours", "num", "Extra hours"), f("Host hours", "num", "Host hours"), f("Extra days", "num", "Extra days"),
    f("Travel fee", "num", "Travel fee ($)"), f("Discount", "num", "Discount ($)"),
    f("Phone", "text", "Phone"), f("Email", "text", "Email"), f("Instagram", "text", "Instagram"),
    f("Notes", "note", "Notes", { wide: true })
  ];
}
function control(f, n) {
  const id = "f" + n, lab = "<label for=\"" + id + "\">" + esc(f.label) + "</label>", hint = f.hint ? "<small>" + esc(f.hint) + "</small>" : "";
  if (f.kind === "yes") return "<div class=\"fld tickf\"><input id=\"" + id + "\" type=\"checkbox\">" + lab + "</div>";
  const c = f.kind === "pick" ? "<select id=\"" + id + "\"><option value=\"\">" + esc(f.blank) + "</option>" + f.options.map(o => "<option>" + esc(o) + "</option>").join("") + "</select>"
    : f.kind === "note" ? "<textarea id=\"" + id + "\"></textarea>" : f.kind === "date" ? "<input id=\"" + id + "\" type=\"date\">"
    : f.kind === "num" ? "<input id=\"" + id + "\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"any\">" : "<input id=\"" + id + "\" type=\"text\" autocomplete=\"off\">";
  return "<div class=\"fld" + (f.wide ? " wide" : "") + "\">" + lab + c + hint + "</div>";
}
function openNew() {
  if (!S.data) return;
  const fields = newFields();
  show("<h2 id=\"dlg-title\">Add a booking</h2><p class=\"pk-c\">Goes into the next empty row of the tracker.</p>" +
    "<form id=\"frm\" novalidate><div class=\"fields\">" + fields.map(control).join("") + "</div><p class=\"err\" id=\"err\" role=\"alert\"></p><button class=\"btn big\" type=\"submit\" id=\"save\">Add to the tracker</button></form><button class=\"linkbtn center\" type=\"button\" data-close>Cancel</button>", true);
  form = fields;
}
dlg.addEventListener("submit", async e => {
  e.preventDefault(); if (!form) return;
  const out = {}, btn = $("#save"), err = $("#err");
  form.forEach((f, n) => { const el = $("#f" + n), v = f.kind === "yes" ? (el.checked ? "Yes" : "") : el.value.trim(); if (v !== "") out[f.key] = v; });
  if (!out["Client name"] || !out["Event date"] || !out["Package"]) { err.textContent = "A new booking needs a client name, an event date and a package."; return; }
  btn.disabled = true; btn.textContent = "Saving…"; err.textContent = "";
  try { const res = await server("addBooking", out); dlg.close(); apply(res.data); toast("Added " + out["Client name"] + " as " + (res.id || "a new booking") + "."); }
  catch (x) { err.textContent = "Not saved. " + why(x); btn.disabled = false; btn.textContent = "Add to the tracker"; }
});

/* ---------- taps ---------- */
document.addEventListener("click", e => {
  if (e.target === dlg) { dlg.close(); return; }
  if (e.target.id === "scrim") { if ($("#menu").classList.contains("open")) menu(false); else sheet(false); return; }
  const t = e.target.closest("[data-tab],[data-menu-open],[data-menu-close],[data-fopen],[data-fclose],[data-freset],[data-acc],[data-tick],[data-month],[data-item],[data-opt],[data-mk],[data-new],[data-close],[data-refresh]");
  if (!t) return;
  const d = t.dataset, item = id => S.items.find(i => i.id === id);
  if (d.tab) { go(d.tab); if ($("#menu").classList.contains("open")) menu(false); }
  else if (d.menuOpen != null) menu(true);
  else if (d.menuClose != null) menu(false);
  else if (d.fopen != null) sheet(true);
  else if (d.fclose != null) sheet(false);
  else if (d.freset != null) { Object.keys(S.f).forEach(k => S.f[k] = true); draw(); }
  else if (d.acc) { S.acc = S.acc === d.acc ? "" : d.acc; draw(); }
  else if (d.tick) { S.f[d.tick] = !S.f[d.tick]; draw(); }
  else if (d.month) { const n = S.ym[0] * 12 + S.ym[1] + +d.month; S.ym = [Math.floor(n / 12), n % 12]; draw(); }
  else if (d.opt) setStatus(item(d.id), d.opt);
  else if (d.mk) setStatus(item(d.mk), "Waiting on deposit", d.skip != null ? "" : $("#edate").value);
  else if (d.item) { const i = item(d.item); if (i && !i.booking) openPicker(i); }
  else if (d.new != null) openNew();
  else if (d.close != null) dlg.close();
  else if (d.refresh != null) load();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || dlg.open) return;
  if ($("#menu").classList.contains("open")) menu(false); else if ($("#filter").classList.contains("open")) sheet(false);
});
matchMedia("(min-width:1000px)").addEventListener("change", () => { $("#menu").classList.remove("open"); $("#filter").classList.remove("open"); $("#scrim").classList.remove("on"); document.body.classList.remove("lock"); draw(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.data && !DEMO && !dlg.open && Date.now() - S.readAt > 120000) load(); });

/* ---------- sample data, used only until the back end address is filled in above ---------- */

function demoServer(fn, arg) {

    const eq = (row, name, contact, type, date, message, status, what, bookingId) => ({ row, received: at(-row), name, contact, type, date, message, status, what: what || "", bookingId: bookingId || "" });
    demoDb = {
      bookings: [

        bk(6, "Mereana", at(10), "Booked", "Birthday", "Rooftop Room", "City", "Celebration hire", 450, 450, { phone: "021 555 0101" }),
        bk(7, "Tavita", at(17), "Booked", "Birthday", "Harbour Lounge", "", "Celebration hire", 720, 150, { nextStep: "Balance due", email: "tavita@example.com" }),
        bk(8, "Priya", at(24), "Waiting on deposit", "Engagement party", "Garden Pavilion", "Howick", "Celebration hire", 450, 0, { nextStep: "Get deposit" }),
        bk(9, "Northside Night Market", at(31), "Booked", "Market / fair", "Northside Car Park", "Albany", "Custom", 300, 300),
        bk(10, "Hana and Joe", at(45), "Waiting on deposit", "Wedding", "Vineyard Estate", "Kumeu", "Forever", 795, 0, { nextStep: "Get deposit" }),
        bk(11, "Kiri", at(20), "Cancelled", "Birthday", "", "", "Celebration hire", 450, 0, { cancelled: "Yes" }),
        bk(12, "Sam", "", "Date needed", "Wedding", "", "", "Classic", 550, 0, { nextStep: "Date needed" })
      ],
      enquiries: [
        eq(2, "Rangi", "Instagram @sample.rangi", "Wedding", "", "", "Cancelled", "Cancelled"),
        eq(3, "Tia Sample", "Phone 021 555 0142", "Birthday", MONTHS[far.m] + " " + far.y, "Venue: 12 Sample Road, Sunnyvale", "New"),
        eq(4, "Daniel Sample", "Phone 022 555 0177", "Birthday", long(at(4)), "Venue: Rooftop Bar", "New"),
        eq(5, "Mali Sample", "Phone 021 555 0190", "Wedding", long(at(11)), "Venue: Windsor Gardens", "Waiting on response"),
        eq(6, "Jess", "Instagram @sample.jess", "Birthday", long(at(17)), "Venue: The Loft, Ponsonby", "New"),
        eq(7, "Hana and Joe", "Phone 021 555 0123", "Wedding", long(at(45)), "Venue: Vineyard Estate", "Waiting on deposit", "Moved to bookings", "B-0006"),
        eq(8, "Brightside Ltd", "Phone 09 555 0100", "Brand / corporate", "", "Staff party, date to be confirmed", "Waiting on response")
      ],
      lists: { "Event type": ["Wedding", "Engagement party", "Birthday", "Anniversary", "Baby shower", "Other celebration", "Brand / corporate", "Expo / show", "Market / fair"], "Region": ["Auckland", "Hamilton", "Waikato (other)"], "How they found us": ["Instagram", "Referral", "Repeat client"] },
      packages: [{ name: "Classic", price: 550 }, { name: "Forever", price: 795 }, { name: "Celebration hire", price: 450 }, { name: "Custom", price: null }]
    };
  }
  const db = demoDb, nextRow = () => Math.max(...db.bookings.map(b => b.row)) + 1;
  let id = "";
  if (fn === "setEnquiryStatus") {
    const q = db.enquiries.find(x => x.row === arg.row && x.name === arg.name); if (!q) throw new Error("That enquiry has moved. Press Refresh.");
    q.status = arg.status; q.what = arg.status === "Cancelled" ? "Cancelled" : ""; q.bookingId = "";
    if (arg.status === "Waiting on deposit") {
      const row = nextRow(), date = arg.eventDate || parseLoose(q.date) || ""; id = "B-" + String(row - 4).padStart(4, "0");
      db.bookings.push({ row, id, client: q.name, date, status: date ? "Waiting on deposit" : "Date needed", nextStep: "Get deposit", phone: (/^Phone\s+(.+)/.exec(q.contact) || [])[1] || "", email: "", insta: (/^Instagram\s+(.+)/.exec(q.contact) || [])[1] || "", type: q.type, venue: ((/venue:\s*([^\n]+)/i.exec(q.message) || [])[1] || "").trim(), suburb: "", region: "", pkg: "", cancelled: "", notes: "", total: 0, received: 0, owing: 0, invoice: "" });

    const row = nextRow(), p = db.packages.find(x => x.name === arg["Package"]), total = num(arg["Custom price"]) || (p && p.price) || 0; id = "B-" + String(row - 4).padStart(4, "0");

  }
  return { id, data: JSON.parse(JSON.stringify(Object.assign({ readAt: Date.now() }, db))) };
}
